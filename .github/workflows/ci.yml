name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/ImmoDigger.slnx
      - run: dotnet build backend/ImmoDigger.slnx --no-restore --configuration Release
      - run: dotnet test backend/ImmoDigger.slnx --no-build --configuration Release
      - name: Audit dependencies
        shell: bash
        run: |
          dotnet list backend/ImmoDigger.slnx package --vulnerable --include-transitive --format json > audit.json
          jq -e '[.. | objects | (.vulnerabilities? // [])[]] | length == 0' audit.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
